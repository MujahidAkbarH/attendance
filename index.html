<script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxdzOJceHv9DGzxYhfpmjU9jWN-b5H2aQ-7GoHtWrGmpkOcNHkNuma1rCHftwqDvDME/exec';
    const ADMIN_PIN = "7860";

    let currentRole = 'none';
    let localStaffCache = null;
    let staffFetchPromise = null;

    function nav(viewId, title = "Dashboard") {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        document.getElementById('sub-header').innerText = title;
    }

    async function apiCall(payload) {
        try {
            const response = await fetch('https://script.google.com/macros/s/AKfycbxdzOJceHv9DGzxYhfpmjU9jWN-b5H2aQ-7GoHtWrGmpkOcNHkNuma1rCHftwqDvDME/exec', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) });
            return await response.json();
        } catch (e) {
            return { success: false, message: "Network Error" };
        }
    }

    // BACKGROUND PRE-FETCH ENGINE
    function fetchStaffData(force = false) {
        if (!staffFetchPromise || force) {
            staffFetchPromise = apiCall({ action: 'getStaff' }).then(res => {
                if (res.success) localStaffCache = res.staff;
                return res;
            });
        }
        return staffFetchPromise;
    }

    function loginAdmin() {
        if (document.getElementById('adminPin').value === ADMIN_PIN) {
            currentRole = 'admin';
            document.getElementById('adminPin').value = '';
            nav('view-admin-dash', 'Admin Dashboard');
            fetchStaffData(true);
        } else alert("Invalid PIN");
    }

    function logout() {
        currentRole = 'none';
        localStaffCache = null;
        staffFetchPromise = null;
        nav('view-home', 'Authentication');
    }

    async function submitAddTeacher() {
        const name = document.getElementById('addName').value, fname = document.getElementById('addFName').value, dept = document.getElementById('addDept').value;
        if (!name || !dept) return alert("Name and Department are required!");

        const btn = document.getElementById('addBtn'), msg = document.getElementById('add-msg');
        btn.innerHTML = '<span class="loader border-white"></span> Registering...';

        const res = await apiCall({ action: 'addTeacher', data: { name, fname, dept } });
        btn.innerHTML = 'Register Staff';

        if (res.success) {
            msg.innerHTML = `<span class="text-emerald-600">✔ ${res.message}</span>`;
            if (localStaffCache) localStaffCache.push(res.staffData);
            setTimeout(() => { document.getElementById('addName').value = ''; document.getElementById('addFName').value = ''; document.getElementById('addDept').value = ''; msg.innerHTML = ''; nav('view-admin-dash'); }, 1500);
        } else msg.innerHTML = `<span class="text-red-600">✖ ${res.message}</span>`;
    }

    function openEditTeacher(id) {
        const t = localStaffCache.find(s => s.id === id);
        if (!t) return;
        document.getElementById('editId').value = t.id;
        document.getElementById('editDisplayId').innerText = "ID: " + t.id;
        document.getElementById('editName').value = t.name;
        document.getElementById('editFName').value = t.fname;
        document.getElementById('editDept').value = t.dept;
        document.getElementById('edit-msg').innerHTML = '';
        nav('view-edit-teacher', 'Edit Staff');
    }

    async function submitEditTeacher() {
        const id = document.getElementById('editId').value, name = document.getElementById('editName').value, fname = document.getElementById('editFName').value, dept = document.getElementById('editDept').value;
        const btn = document.getElementById('editBtn'), msg = document.getElementById('edit-msg');
        btn.innerHTML = '<span class="loader border-white"></span> Saving...';

        const res = await apiCall({ action: 'editTeacher', data: { id, name, fname, dept } });
        btn.innerHTML = 'Save Changes';

        if (res.success) {
            msg.innerHTML = `<span class="text-emerald-600">✔ ${res.message}</span>`;
            if (localStaffCache) {
                const idx = localStaffCache.findIndex(s => s.id === id);
                if (idx !== -1) localStaffCache[idx] = { ...localStaffCache[idx], name, fname, dept };
            }
            setTimeout(() => loadStaffList(), 1000);
        } else msg.innerHTML = `<span class="text-red-600">✖ ${res.message}</span>`;
    }

    async function deleteStaff(id, btnElement) {
        if (!confirm(`Mark ${id} as Left? They will not be able to mark attendance.`)) return;
        btnElement.innerText = "...";

        const idx = localStaffCache.findIndex(s => s.id === id);
        if (idx !== -1) localStaffCache[idx].status = 'Left';
        renderStaffList(localStaffCache);
        apiCall({ action: 'deleteTeacher', teacherId: id });
    }

    async function loadStaffList(forceSync = false) {
        nav('view-staff-list', 'Manage Staff');
        document.getElementById('staffSearch').value = '';

        if (localStaffCache && !forceSync) {
            renderStaffList(localStaffCache);
            return;
        }

        document.getElementById('staff-container').innerHTML = '';
        document.getElementById('staff-loading').classList.remove('hidden');

        const res = await fetchStaffData(forceSync);

        document.getElementById('staff-loading').classList.add('hidden');
        if (res.success) renderStaffList(localStaffCache);
    }

    function renderStaffList(staffArray) {
        const container = document.getElementById('staff-container');
        container.innerHTML = '';
        staffArray.forEach(staff => {
            const isLeft = staff.status === 'Left';
            const card = document.createElement('div');
            card.className = `p-4 rounded-xl border ${isLeft ? 'bg-slate-100 border-slate-200 opacity-70' : 'bg-white border-slate-300 shadow-sm'} flex justify-between items-center transition-all`;
            card.innerHTML = `
          <div class="flex-1">
            <p class="font-bold text-slate-800">${staff.name} <span class="text-xs text-blue-600 ml-1">(${staff.id})</span></p>
            <p class="text-xs font-semibold text-slate-500 uppercase">${staff.dept}</p>
          </div>
          <div class="flex gap-2">
            <button onclick="triggerReview('${staff.id}')" class="p-2 bg-blue-50 text-blue-600 rounded-lg font-bold text-xs shadow-sm">Review</button>
            ${!isLeft ? `<button onclick="openEditTeacher('${staff.id}')" class="p-2 bg-slate-100 text-slate-600 rounded-lg font-bold text-xs shadow-sm">Edit</button>` : ''}
            ${!isLeft ? `<button onclick="deleteStaff('${staff.id}', this)" class="p-2 bg-red-50 text-red-600 rounded-lg font-bold text-xs shadow-sm">Remove</button>` : `<span class="text-xs font-bold text-red-500 p-2 border border-red-200 rounded-lg bg-red-50">LEFT</span>`}
          </div>
        `;
            container.appendChild(card);
        });
    }

    function filterStaff() {
        const term = document.getElementById('staffSearch').value.toLowerCase();
        if (!localStaffCache) return;
        const filtered = localStaffCache.filter(s => s.name.toLowerCase().includes(term) || s.id.toLowerCase().includes(term) || s.dept.toLowerCase().includes(term));
        renderStaffList(filtered);
    }

    function checkReviewEndUser() {
        const id = document.getElementById('teacherReviewId').value;
        if (!id) return;
        currentRole = 'enduser';
        triggerReview(id);
        document.getElementById('teacherReviewId').value = '';
    }

    async function triggerReview(id) {
        nav('view-review', `Review: ${id}`);
        document.getElementById('rev-name').innerText = "Fetching data...";
        document.getElementById('rev-dept').innerText = "";
        document.getElementById('rev-month').innerText = "Attendance for: ...";
        document.getElementById('rev-total').innerText = "-";
        document.getElementById('rev-present').innerText = "-";
        document.getElementById('rev-absent').innerText = "-";
        document.getElementById('rev-status-box').className = "hidden";

        const res = await apiCall({ action: 'getReview', teacherId: id });
        if (res.success) {
            document.getElementById('rev-name').innerText = res.stats.name;
            document.getElementById('rev-dept').innerText = res.stats.dept;
            document.getElementById('rev-month').innerText = "Attendance for: " + res.stats.month;
            document.getElementById('rev-total').innerText = res.stats.totalDays;
            document.getElementById('rev-present').innerText = res.stats.present;
            document.getElementById('rev-absent').innerText = res.stats.absent;

            const statBox = document.getElementById('rev-status-box');
            if (res.stats.status === "Left") {
                statBox.innerText = "STATUS: INACTIVE / LEFT";
                statBox.className = "text-center font-bold text-xs uppercase tracking-wider py-2 rounded-lg bg-red-100 text-red-700 mt-2 block";
            } else {
                statBox.innerText = "STATUS: ACTIVE";
                statBox.className = "text-center font-bold text-xs uppercase tracking-wider py-2 rounded-lg bg-emerald-100 text-emerald-700 mt-2 block";
            }
        } else {
            document.getElementById('rev-name').innerText = "ID Not Found";
        }
    }

    function closeReview() {
        if (currentRole === 'admin') nav('view-staff-list', 'Manage Staff');
        else nav('view-home', 'Authentication');
    }


    // =======================================================
    // FIX 2: SCANNER ENGINE (Locks & Timeout Fixes)
    // =======================================================
    let html5QrCode, currentFacingMode = "environment";
    const scanCooldowns = new Map();
    let isProcessingScan = false; // Prevents multiple requests from firing at once
    let statusResetTimer = null;  // Prevents UI messages from overlapping

    document.addEventListener("DOMContentLoaded", () => { html5QrCode = new Html5Qrcode("reader"); });

    function setScanStatus(text, type) {
        const el = document.getElementById('scan-status');
        el.innerText = text;

        // Clear the reset timer if a new scan happens so messages don't vanish instantly
        if (statusResetTimer) clearTimeout(statusResetTimer);

        const base = "h-14 rounded-xl flex items-center justify-center font-bold text-sm tracking-wide px-4 text-center border transition-colors duration-300 ";
        if (type === 'ready') el.className = base + "text-slate-600 bg-slate-100 border-slate-300";
        else if (type === 'scan') el.className = base + "text-blue-800 bg-blue-100 border-blue-300";
        else if (type === 'success') el.className = base + "text-emerald-800 bg-emerald-100 border-emerald-300";
        else el.className = base + "text-red-800 bg-red-100 border-red-300";
    }

    function startScanner() {
        document.getElementById('start-btn').classList.add('hidden');
        document.getElementById('reader-container').classList.remove('hidden');
        document.getElementById('camera-controls').classList.remove('hidden');
        setScanStatus("SCANNING...", 'ready');
        html5QrCode.start({ facingMode: currentFacingMode }, { fps: 60, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 }, (decodedText) => { handleScanResult(decodedText); }, () => { }).catch(e => { alert("Camera Error"); stopScanner(); });
    }

    function stopScanner() {
        document.getElementById('start-btn').classList.remove('hidden');
        document.getElementById('reader-container').classList.add('hidden');
        document.getElementById('camera-controls').classList.add('hidden');
        setScanStatus("SYSTEM STANDBY", 'ready');
        if (html5QrCode && html5QrCode.isScanning) html5QrCode.stop().catch(e => { });
    }

    function switchCamera() {
        currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
        if (html5QrCode && html5QrCode.isScanning) html5QrCode.stop().then(() => setTimeout(() => startScanner(), 150));
    }

    async function handleScanResult(id) {
        const cleanId = id.toUpperCase().trim();
        const now = Date.now();

        // RACING CONDITION FIX: Reject if currently processing an API call or scanned recently
        if (isProcessingScan) return;
        if (scanCooldowns.get(cleanId) && (now - scanCooldowns.get(cleanId)) < 4000) return;

        scanCooldowns.set(cleanId, now);
        isProcessingScan = true; // Lock the scanner

        const container = document.getElementById('reader-container');
        container.classList.add('scan-highlight');
        if (navigator.vibrate) navigator.vibrate(40);
        setTimeout(() => container.classList.remove('scan-highlight'), 300);

        setScanStatus(`VERIFYING: ${cleanId}`, 'scan');

        try {
            const res = await apiCall({ action: 'markAttendance', teacherId: cleanId });

            if (res.success) {
                setScanStatus(`✔ ${res.message.toUpperCase()}`, 'success');
                if (navigator.vibrate) navigator.vibrate([80, 40, 80]);
            } else {
                setScanStatus(`⚠ ${res.message.toUpperCase()}`, 'error');
                if (navigator.vibrate) navigator.vibrate(200);
            }
        } catch (e) {
            setScanStatus("✖ NETWORK ERROR", 'error');
        } finally {
            isProcessingScan = false; // Unlock the scanner
            statusResetTimer = setTimeout(() => setScanStatus("READY FOR NEXT", 'ready'), 3000);
        }
    }

    function submitManualScan() {
        const el = document.getElementById('manualId');
        if (el.value) { handleScanResult(el.value); el.value = ''; }
    }
</script>
