<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>School Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: #0f172a;
            overscroll-behavior-y: none;
        }

        .view {
            display: none;
        }

        .view.active {
            display: flex;
            flex-direction: column;
        }

        .scan-highlight {
            border-color: #f59e0b !important;
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.5);
        }

        #reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            border-radius: 0.75rem;
        }

        #reader__dashboard_section_csr span {
            display: none !important;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">

    <div
        class="bg-white/80 backdrop-blur-2xl border border-slate-200/60 shadow-[0_8px_30px_rgb(0,0,0,0.08)] rounded-3xl p-6 sm:p-8 w-full max-w-md relative overflow-hidden">

        <div class="text-center mb-6">
            <h1 class="text-2xl font-extrabold text-blue-800 tracking-tight">Star Kids Portal</h1>
            <p id="sub-header" class="text-xs font-bold text-slate-500 mt-1 uppercase tracking-widest">Authentication
            </p>
        </div>

        <!-- HOME / LOGIN -->
        <div id="view-home" class="view active gap-6">
            <div class="bg-blue-50 border border-blue-100 rounded-2xl p-5 flex flex-col gap-3">
                <label class="text-xs font-bold text-blue-800 uppercase tracking-wider">Teacher Review Portal</label>
                <input type="text" id="teacherReviewId"
                    class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-lg focus:outline-none focus:border-blue-500 font-bold uppercase shadow-sm"
                    placeholder="e.g. SKPP-01">
                <button onclick="checkReviewEndUser(event)"
                    class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white py-3 rounded-xl font-bold transition-all shadow-md">Check
                    My Attendance</button>
            </div>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-slate-300"></div>
                <span class="flex-shrink-0 mx-4 text-slate-400 font-bold text-xs uppercase">OR</span>
                <div class="flex-grow border-t border-slate-300"></div>
            </div>

            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5 flex flex-col gap-3">
                <label class="text-xs font-bold text-slate-600 uppercase tracking-wider">Admin Login</label>
                <input type="password" id="adminPin"
                    class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-center text-2xl focus:outline-none focus:border-slate-500 font-bold tracking-widest shadow-sm"
                    placeholder="••••">
                <button onclick="loginAdmin()"
                    class="w-full bg-slate-800 hover:bg-slate-900 text-white py-3 rounded-xl font-bold transition-all shadow-md">Enter
                    Dashboard</button>
            </div>
        </div>

        <!-- ADMIN DASHBOARD -->
        <div id="view-admin-dash" class="view gap-4">
            <button onclick="nav('view-scanner')"
                class="bg-blue-600 hover:bg-blue-700 text-white p-5 rounded-2xl font-bold flex items-center justify-center gap-3 shadow-md transition-all text-lg">
                📷 Launch Scanner
            </button>
            <button onclick="nav('view-add-teacher')"
                class="bg-white border-2 border-slate-200 hover:bg-slate-50 text-slate-700 p-4 rounded-2xl font-bold flex items-center justify-center gap-3 transition-all">
                ➕ Add New Teacher
            </button>
            <button onclick="loadStaffList()"
                class="bg-white border-2 border-slate-200 hover:bg-slate-50 text-slate-700 p-4 rounded-2xl font-bold flex items-center justify-center gap-3 transition-all">
                👥 Manage Staff & Reviews
            </button>
            <button onclick="logout()"
                class="mt-4 text-xs font-bold text-red-500 tracking-widest uppercase text-center w-full">
                🔒 Logout Admin
            </button>
        </div>

        <!-- SCANNER -->
        <div id="view-scanner" class="view gap-4">
            <div id="scan-status"
                class="h-14 rounded-xl flex items-center justify-center font-bold text-sm tracking-wide text-slate-600 bg-slate-100 border border-slate-300 px-4 text-center">
                SYSTEM STANDBY</div>
            <div id="reader-container"
                class="hidden bg-slate-50 p-2 rounded-2xl border-4 border-slate-200 aspect-square">
                <div id="reader"></div>
            </div>
            <button id="start-btn" onclick="startScanner()"
                class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-md">START CAMERA</button>

            <div id="camera-controls" class="hidden flex gap-3">
                <button onclick="switchCamera()"
                    class="flex-1 border-2 border-slate-200 py-3 rounded-xl font-bold text-slate-600">🔄 Flip</button>
                <button onclick="stopScanner()"
                    class="flex-1 border-2 border-red-200 bg-red-50 py-3 rounded-xl font-bold text-red-600">⏹️
                    Stop</button>
            </div>

            <div class="flex gap-2 mt-2">
                <input type="text" id="manualId"
                    class="w-full border-2 border-slate-300 rounded-xl px-4 text-sm font-bold uppercase"
                    placeholder="SKPP-01">
                <button onclick="submitManualScan()"
                    class="bg-slate-800 text-white px-6 py-3 rounded-xl font-bold">Mark</button>
            </div>
            <button onclick="nav('view-admin-dash'); stopScanner();"
                class="text-sm font-bold text-slate-400 mt-2 text-center w-full">← Back to Dash</button>
        </div>

        <!-- ADD TEACHER -->
        <div id="view-add-teacher" class="view gap-4">
            <input type="text" id="addName" class="border-2 border-slate-300 rounded-xl px-4 py-3 font-bold"
                placeholder="Teacher Name">
            <input type="text" id="addFName" class="border-2 border-slate-300 rounded-xl px-4 py-3 font-bold"
                placeholder="Father Name">
            <input type="text" id="addDept" class="border-2 border-slate-300 rounded-xl px-4 py-3 font-bold"
                placeholder="Department">
            <button id="addBtn" onclick="submitAddTeacher()"
                class="bg-blue-600 text-white py-4 rounded-xl font-bold shadow-md flex justify-center items-center gap-2">Register
                Staff</button>
            <div id="add-msg" class="text-center font-bold text-sm h-6"></div>
            <button onclick="nav('view-admin-dash')" class="text-sm font-bold text-slate-400 text-center w-full">← Back
                to Dash</button>
        </div>

        <!-- EDIT TEACHER -->
        <div id="view-edit-teacher" class="view gap-4">
            <input type="hidden" id="editId">
            <div class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1" id="editDisplayId">ID: </div>
            <input type="text" id="editName" class="border-2 border-slate-300 rounded-xl px-4 py-3 font-bold"
                placeholder="Teacher Name">
            <input type="text" id="editFName" class="border-2 border-slate-300 rounded-xl px-4 py-3 font-bold"
                placeholder="Father Name">
            <input type="text" id="editDept" class="border-2 border-slate-300 rounded-xl px-4 py-3 font-bold"
                placeholder="Department">
            <button id="editBtn" onclick="submitEditTeacher()"
                class="bg-emerald-600 text-white py-4 rounded-xl font-bold shadow-md flex justify-center items-center gap-2">Save
                Changes</button>
            <div id="edit-msg" class="text-center font-bold text-sm h-6"></div>
            <button onclick="nav('view-staff-list', 'Manage Staff')"
                class="text-sm font-bold text-slate-400 text-center w-full">← Back to Staff List</button>
        </div>

        <!-- STAFF LIST -->
        <div id="view-staff-list" class="view gap-4">
            <div class="flex justify-between items-center">
                <input type="text" id="staffSearch" onkeyup="filterStaff()"
                    class="w-full border-2 border-slate-300 rounded-xl px-4 py-2 text-sm font-bold shadow-sm"
                    placeholder="Search staff...">
                <button onclick="loadStaffList(true)"
                    class="ml-2 bg-slate-200 hover:bg-slate-300 p-2 rounded-lg transition-colors"
                    title="Force Sync">🔄</button>
            </div>
            <div id="staff-loading" class="text-center font-bold text-slate-500 py-4 hidden"><span
                    class="loader border-blue-600"></span> Syncing DB...</div>
            <div id="staff-container" class="flex flex-col gap-3 max-h-[55vh] overflow-y-auto pr-2"></div>
            <button onclick="nav('view-admin-dash')" class="text-sm font-bold text-slate-400 mt-2 text-center w-full">←
                Back to Dash</button>
        </div>

        <!-- ATTENDANCE REVIEW -->
        <div id="view-review" class="view gap-5">
            <div class="text-center">
                <h2 id="rev-name" class="text-xl font-extrabold text-blue-900">Loading...</h2>
                <p id="rev-dept" class="text-xs font-bold text-slate-500 uppercase mt-1">...</p>
                <div class="inline-block bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full mt-2 uppercase tracking-wide"
                    id="rev-month">Attendance for: ...</div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div
                    class="bg-slate-100 border border-slate-200 rounded-2xl p-4 flex flex-col items-center justify-center">
                    <span class="text-[2.5rem] font-black text-slate-700 leading-none" id="rev-total">0</span>
                    <span class="text-[0.65rem] font-bold text-slate-500 uppercase tracking-widest mt-1">Total
                        Days</span>
                </div>
                <div class="flex flex-col gap-3">
                    <div
                        class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 flex justify-between items-center shadow-sm">
                        <span class="text-xs font-bold text-emerald-700 uppercase">Present</span>
                        <span class="text-xl font-black text-emerald-600" id="rev-present">0</span>
                    </div>
                    <div
                        class="bg-red-50 border border-red-200 rounded-xl p-3 flex justify-between items-center shadow-sm">
                        <span class="text-xs font-bold text-red-700 uppercase">Absent</span>
                        <span class="text-xl font-black text-red-600" id="rev-absent">0</span>
                    </div>
                </div>
            </div>

            <div id="rev-status-box" class="text-center font-bold text-xs uppercase tracking-wider py-2 rounded-lg">
            </div>
            <button onclick="closeReview()" class="bg-slate-800 text-white py-3 rounded-xl font-bold mt-2">Close
                Review</button>
        </div>

    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxdzOJceHv9DGzxYhfpmjU9jWN-b5H2aQ-7GoHtWrGmpkOcNHkNuma1rCHftwqDvDME/exec';
        const ADMIN_PIN = "7860";

        let currentRole = 'none';
        let localStaffCache = null;
        let staffFetchPromise = null;

        function nav(viewId, title = "Dashboard") {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            document.getElementById('sub-header').innerText = title;
        }

        // NEW: Robust Network Request with 12-second Timeout to prevent permanent freezing
        async function apiCall(payload) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 12000);
            try {
                const response = await fetch('https://script.google.com/macros/s/AKfycbxdzOJceHv9DGzxYhfpmjU9jWN-b5H2aQ-7GoHtWrGmpkOcNHkNuma1rCHftwqDvDME/exec', {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                return await response.json();
            } catch (e) {
                clearTimeout(timeoutId);
                return { success: false, message: "Network Dropped or Timeout" };
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            html5QrCode = new Html5Qrcode("reader");
            fetch('https://script.google.com/macros/s/AKfycbxdzOJceHv9DGzxYhfpmjU9jWN-b5H2aQ-7GoHtWrGmpkOcNHkNuma1rCHftwqDvDME/exec', { method: 'POST', body: JSON.stringify({ action: 'ping' }) }).catch(e => console.log("Ping failed"));
        });

        function fetchStaffData(force = false) {
            if (!staffFetchPromise || force) {
                staffFetchPromise = apiCall({ action: 'getStaff' }).then(res => {
                    if (res.success) localStaffCache = res.staff;
                    return res;
                });
            }
            return staffFetchPromise;
        }

        function loginAdmin() {
            if (document.getElementById('adminPin').value === ADMIN_PIN) {
                currentRole = 'admin';
                document.getElementById('adminPin').value = '';
                nav('view-admin-dash', 'Admin Dashboard');
                fetchStaffData(true);
            } else alert("Invalid PIN");
        }

        function logout() {
            currentRole = 'none';
            localStaffCache = null;
            staffFetchPromise = null;
            nav('view-home', 'Authentication');
        }

        async function submitAddTeacher() {
            const name = document.getElementById('addName').value, fname = document.getElementById('addFName').value, dept = document.getElementById('addDept').value;
            if (!name || !dept) return alert("Name and Department are required!");
            const btn = document.getElementById('addBtn'), msg = document.getElementById('add-msg');
            btn.innerHTML = '<span class="loader border-white"></span> Registering...';
            const res = await apiCall({ action: 'addTeacher', data: { name, fname, dept } });
            btn.innerHTML = 'Register Staff';
            if (res.success) {
                msg.innerHTML = `<span class="text-emerald-600">✔ ${res.message}</span>`;
                if (localStaffCache) localStaffCache.push(res.staffData);
                setTimeout(() => { document.getElementById('addName').value = ''; document.getElementById('addFName').value = ''; document.getElementById('addDept').value = ''; msg.innerHTML = ''; nav('view-admin-dash'); }, 1500);
            } else msg.innerHTML = `<span class="text-red-600">✖ ${res.message}</span>`;
        }

        function openEditTeacher(id) {
            const t = localStaffCache.find(s => s.id === id);
            if (!t) return;
            document.getElementById('editId').value = t.id;
            document.getElementById('editDisplayId').innerText = "ID: " + t.id;
            document.getElementById('editName').value = t.name;
            document.getElementById('editFName').value = t.fname;
            document.getElementById('editDept').value = t.dept;
            document.getElementById('edit-msg').innerHTML = '';
            nav('view-edit-teacher', 'Edit Staff');
        }

        async function submitEditTeacher() {
            const id = document.getElementById('editId').value, name = document.getElementById('editName').value, fname = document.getElementById('editFName').value, dept = document.getElementById('editDept').value;
            const btn = document.getElementById('editBtn'), msg = document.getElementById('edit-msg');
            btn.innerHTML = '<span class="loader border-white"></span> Saving...';
            const res = await apiCall({ action: 'editTeacher', data: { id, name, fname, dept } });
            btn.innerHTML = 'Save Changes';
            if (res.success) {
                msg.innerHTML = `<span class="text-emerald-600">✔ ${res.message}</span>`;
                if (localStaffCache) {
                    const idx = localStaffCache.findIndex(s => s.id === id);
                    if (idx !== -1) localStaffCache[idx] = { ...localStaffCache[idx], name, fname, dept };
                }
                setTimeout(() => loadStaffList(), 1000);
            } else msg.innerHTML = `<span class="text-red-600">✖ ${res.message}</span>`;
        }

        async function deleteStaff(id, btnElement) {
            if (!confirm(`Mark ${id} as Left? They will not be able to mark attendance.`)) return;
            btnElement.innerText = "...";
            const idx = localStaffCache.findIndex(s => s.id === id);
            if (idx !== -1) localStaffCache[idx].status = 'Left';
            renderStaffList(localStaffCache);
            apiCall({ action: 'deleteTeacher', teacherId: id });
        }

        async function loadStaffList(forceSync = false) {
            nav('view-staff-list', 'Manage Staff');
            document.getElementById('staffSearch').value = '';
            if (localStaffCache && !forceSync) {
                renderStaffList(localStaffCache);
                return;
            }
            document.getElementById('staff-container').innerHTML = '';
            document.getElementById('staff-loading').classList.remove('hidden');
            const res = await fetchStaffData(forceSync);
            document.getElementById('staff-loading').classList.add('hidden');
            if (res.success) renderStaffList(localStaffCache);
        }

        function renderStaffList(staffArray) {
            const container = document.getElementById('staff-container');
            container.innerHTML = '';
            staffArray.forEach(staff => {
                const isLeft = staff.status === 'Left';
                const card = document.createElement('div');
                card.className = `p-4 rounded-xl border ${isLeft ? 'bg-slate-100 border-slate-200 opacity-70' : 'bg-white border-slate-300 shadow-sm'} flex justify-between items-center transition-all`;
                card.innerHTML = `
          <div class="flex-1">
            <p class="font-bold text-slate-800">${staff.name} <span class="text-xs text-blue-600 ml-1">(${staff.id})</span></p>
            <p class="text-xs font-semibold text-slate-500 uppercase">${staff.dept}</p>
          </div>
          <div class="flex gap-2">
            <button onclick="triggerReview('${staff.id}')" class="p-2 bg-blue-50 text-blue-600 rounded-lg font-bold text-xs shadow-sm">Review</button>
            ${!isLeft ? `<button onclick="openEditTeacher('${staff.id}')" class="p-2 bg-slate-100 text-slate-600 rounded-lg font-bold text-xs shadow-sm">Edit</button>` : ''}
            ${!isLeft ? `<button onclick="deleteStaff('${staff.id}', this)" class="p-2 bg-red-50 text-red-600 rounded-lg font-bold text-xs shadow-sm">Remove</button>` : `<span class="text-xs font-bold text-red-500 p-2 border border-red-200 rounded-lg bg-red-50">LEFT</span>`}
          </div>
        `;
                container.appendChild(card);
            });
        }

        function filterStaff() {
            const term = document.getElementById('staffSearch').value.toLowerCase();
            if (!localStaffCache) return;
            const filtered = localStaffCache.filter(s => s.name.toLowerCase().includes(term) || s.id.toLowerCase().includes(term) || s.dept.toLowerCase().includes(term));
            renderStaffList(filtered);
        }

        async function checkReviewEndUser(event) {
            const id = document.getElementById('teacherReviewId').value;
            if (!id) return;

            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerHTML = '<span class="loader border-white"></span> Waking Database...';

            currentRole = 'enduser';
            await triggerReview(id);

            btn.innerHTML = originalText;
            document.getElementById('teacherReviewId').value = '';
        }

        async function triggerReview(id) {
            nav('view-review', `Review: ${id}`);
            document.getElementById('rev-name').innerHTML = '<span class="loader border-blue-900"></span> Retrieving Data...';
            document.getElementById('rev-dept').innerText = "";
            document.getElementById('rev-month').innerText = "Attendance for: ...";
            document.getElementById('rev-total').innerText = "-";
            document.getElementById('rev-present').innerText = "-";
            document.getElementById('rev-absent').innerText = "-";
            document.getElementById('rev-status-box').className = "hidden";

            const res = await apiCall({ action: 'getReview', teacherId: id });
            if (res.success) {
                document.getElementById('rev-name').innerText = res.stats.name;
                document.getElementById('rev-dept').innerText = res.stats.dept;
                document.getElementById('rev-month').innerText = "Attendance for: " + res.stats.month;
                document.getElementById('rev-total').innerText = res.stats.totalDays;
                document.getElementById('rev-present').innerText = res.stats.present;
                document.getElementById('rev-absent').innerText = res.stats.absent;

                const statBox = document.getElementById('rev-status-box');
                if (res.stats.status === "Left") {
                    statBox.innerText = "STATUS: INACTIVE / LEFT";
                    statBox.className = "text-center font-bold text-xs uppercase tracking-wider py-2 rounded-lg bg-red-100 text-red-700 mt-2 block";
                } else {
                    statBox.innerText = "STATUS: ACTIVE";
                    statBox.className = "text-center font-bold text-xs uppercase tracking-wider py-2 rounded-lg bg-emerald-100 text-emerald-700 mt-2 block";
                }
            } else {
                document.getElementById('rev-name').innerText = "ID Not Found";
            }
        }

        function closeReview() {
            if (currentRole === 'admin') nav('view-staff-list', 'Manage Staff');
            else nav('view-home', 'Authentication');
        }

        // ==========================================
        // PRO SCANNER ENGINE (Locks to prevent overlap & crashes)
        // ==========================================
        let html5QrCode, currentFacingMode = "environment";
        const scanCooldowns = new Map();
        let isProcessingScan = false;
        let statusResetTimer = null;

        function setScanStatus(text, type) {
            const el = document.getElementById('scan-status');
            el.innerText = text;

            if (statusResetTimer) clearTimeout(statusResetTimer);

            const base = "h-14 rounded-xl flex items-center justify-center font-bold text-sm tracking-wide px-4 text-center border transition-colors duration-300 ";
            if (type === 'ready') el.className = base + "text-slate-600 bg-slate-100 border-slate-300";
            else if (type === 'scan') el.className = base + "text-blue-800 bg-blue-100 border-blue-300";
            else if (type === 'success') el.className = base + "text-emerald-800 bg-emerald-100 border-emerald-300";
            else el.className = base + "text-red-800 bg-red-100 border-red-300";
        }

        function startScanner() {
            document.getElementById('start-btn').classList.add('hidden');
            document.getElementById('reader-container').classList.remove('hidden');
            document.getElementById('camera-controls').classList.remove('hidden');
            setScanStatus("SCANNING...", 'ready');
            html5QrCode.start({ facingMode: currentFacingMode }, { fps: 60, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 }, (decodedText) => { handleScanResult(decodedText); }, () => { }).catch(e => { alert("Camera Error"); stopScanner(); });
        }

        function stopScanner() {
            document.getElementById('start-btn').classList.remove('hidden');
            document.getElementById('reader-container').classList.add('hidden');
            document.getElementById('camera-controls').classList.add('hidden');
            setScanStatus("SYSTEM STANDBY", 'ready');

            try {
                if (html5QrCode) {
                    // Robust safety checks before halting camera
                    const state = html5QrCode.getState();
                    if (state === 3) html5QrCode.resume();
                    if (state === 2 || state === 3) html5QrCode.stop().catch(e => { });
                }
            } catch (e) { }

            isProcessingScan = false;
        }

        function switchCamera() {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            try {
                if (html5QrCode) {
                    const state = html5QrCode.getState();
                    if (state === 3) html5QrCode.resume();
                    if (state === 2 || state === 3) {
                        html5QrCode.stop().then(() => setTimeout(() => startScanner(), 150));
                    } else {
                        startScanner();
                    }
                }
            } catch (e) { }
        }

        async function handleScanResult(id) {
            if (isProcessingScan) return;

            const cleanId = id.toUpperCase().trim();
            const now = Date.now();

            if (scanCooldowns.get(cleanId) && (now - scanCooldowns.get(cleanId)) < 4000) return;

            isProcessingScan = true;
            scanCooldowns.set(cleanId, now);

            // THE FIX: Soft-pause the barcode reader logic, but strictly keep the video live to prevent crashes.
            try {
                if (html5QrCode && (html5QrCode.getState() === 2)) {
                    html5QrCode.pause(); // Using empty parameter allows video stream to flow untouched
                }
            } catch (e) { }

            const container = document.getElementById('reader-container');
            container.classList.add('scan-highlight');
            if (navigator.vibrate) navigator.vibrate(40);
            setTimeout(() => container.classList.remove('scan-highlight'), 300);

            setScanStatus(`VERIFYING: ${cleanId}`, 'scan');

            try {
                const res = await apiCall({ action: 'markAttendance', teacherId: cleanId });

                if (res.success) {
                    setScanStatus(`✔ ${res.message.toUpperCase()}`, 'success');
                    if (navigator.vibrate) navigator.vibrate([80, 40, 80]);
                } else {
                    setScanStatus(`⚠ ${res.message.toUpperCase()}`, 'error');
                    if (navigator.vibrate) navigator.vibrate(200);
                }
            } catch (e) {
                setScanStatus("✖ NETWORK DROPPED / ERROR", 'error');
            } finally {
                // Clear the state regardless of success or failure to avoid permanent lockouts
                statusResetTimer = setTimeout(() => {
                    setScanStatus("READY FOR NEXT", 'ready');
                    isProcessingScan = false;

                    try {
                        if (html5QrCode && html5QrCode.getState() === 3) {
                            html5QrCode.resume();
                        }
                    } catch (e) { }

                }, 2500);
            }
        }

        function submitManualScan() {
            const el = document.getElementById('manualId');
            if (el.value) { handleScanResult(el.value); el.value = ''; }
        }
    </script>
</body>

</html>
