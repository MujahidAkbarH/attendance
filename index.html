<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #e8eff5;
            color: #334155;
        }

        /* Neomorphic Utilities */
        .neo-outset {
            background: #e8eff5;
            box-shadow: 8px 8px 16px #c5d0db, -8px -8px 16px #ffffff;
        }

        .neo-inset {
            background: #e8eff5;
            box-shadow: inset 6px 6px 12px #c5d0db, inset -6px -6px 12px #ffffff;
        }

        .neo-button:active {
            box-shadow: inset 4px 4px 8px #c5d0db, inset -4px -4px 8px #ffffff;
        }

        /* Clean up the injected video element */
        #reader video {
            border-radius: 12px;
            object-fit: cover;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <div class="neo-outset rounded-[2rem] p-6 w-full max-w-md flex flex-col gap-6">

        <!-- Header -->
        <div class="text-center">
            <h1 class="text-2xl font-bold text-blue-700">Attendance</h1>
            <p class="text-sm font-medium text-gray-500 mt-1">Scan QR or enter ID</p>
        </div>

        <!-- Dynamic Status Display -->
        <div id="status"
            class="h-14 rounded-2xl flex items-center justify-center font-bold text-base tracking-wide text-gray-500 transition-colors neo-inset px-4 text-center">
            Ready to Scan
        </div>

        <!-- Scanner Section -->
        <div class="flex flex-col gap-4">

            <!-- Video Container (Hidden by default) -->
            <div id="reader-container" class="hidden neo-inset rounded-2xl p-3">
                <div id="reader" class="w-full overflow-hidden rounded-xl bg-gray-200 aspect-square"></div>
            </div>

            <!-- Massive Start Button -->
            <button id="start-btn" onclick="startScanner()"
                class="w-full neo-outset neo-button py-6 rounded-2xl font-bold text-lg text-blue-600 transition-all flex flex-col items-center gap-2">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z">
                    </path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                START CAMERA
            </button>

            <!-- Camera Controls (Hidden by default) -->
            <div id="camera-controls" class="hidden flex gap-4">
                <button onclick="switchCamera()"
                    class="flex-1 neo-outset neo-button py-3 rounded-xl font-semibold text-gray-600 transition-all flex justify-center items-center gap-2">
                    Flip Camera 🔄
                </button>
                <button onclick="stopScanner()"
                    class="flex-1 neo-outset neo-button py-3 rounded-xl font-semibold text-red-500 transition-all flex justify-center items-center gap-2">
                    Stop ⏹️
                </button>
            </div>
        </div>

        <!-- Visual Divider -->
        <div class="relative flex py-2 items-center">
            <div class="flex-grow border-t border-gray-300"></div>
            <span class="flex-shrink-0 mx-4 text-gray-400 font-semibold text-sm">OR</span>
            <div class="flex-grow border-t border-gray-300"></div>
        </div>

        <!-- Manual Entry Section -->
        <div class="flex flex-col gap-3 bg-[#e8eff5]">
            <label class="text-sm font-bold text-gray-600 ml-2">Manual Entry</label>
            <div class="flex gap-3">
                <input type="text" id="manualId"
                    class="w-full neo-inset rounded-xl px-4 py-4 text-base focus:outline-none placeholder-gray-400 font-medium text-gray-700 transition-all border-none uppercase"
                    placeholder="e.g. TCH-01">
                <button onclick="submitManual()"
                    class="neo-outset neo-button px-6 py-4 rounded-xl font-bold text-blue-600 transition-all border-none">
                    Mark
                </button>
            </div>
        </div>

    </div>

    <script>
        // REPLACE WITH YOUR APPS SCRIPT URL
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxdzOJceHv9DGzxYhfpmjU9jWN-b5H2aQ-7GoHtWrGmpkOcNHkNuma1rCHftwqDvDME/exec';
        let isProcessing = false;

        // Custom Scanner Variables
        let html5QrCode;
        let currentFacingMode = "environment"; // Defaults to back camera

        // Initialize scanner instance
        document.addEventListener("DOMContentLoaded", () => {
            html5QrCode = new Html5Qrcode("reader");
        });

        function startScanner() {
            document.getElementById('start-btn').classList.add('hidden');
            document.getElementById('reader-container').classList.remove('hidden');
            document.getElementById('camera-controls').classList.remove('hidden');
            document.getElementById('status').innerText = "Point at QR Code";

            html5QrCode.start(
                { facingMode: currentFacingMode },
                { fps: 30, qrbox: { width: 250, height: 250 } },
                (decodedText) => { handleResult(decodedText); },
                (errorMessage) => { /* Ignore constant scan errors */ }
            ).catch((err) => {
                alert("Camera access denied. Please check site permissions.");
                stopScanner();
            });
        }

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById('start-btn').classList.remove('hidden');
                    document.getElementById('reader-container').classList.add('hidden');
                    document.getElementById('camera-controls').classList.add('hidden');
                    document.getElementById('status').innerText = "Ready to Scan";
                }).catch(err => console.error(err));
            }
        }

        function switchCamera() {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    setTimeout(() => startScanner(), 200);
                });
            }
        }

        async function handleResult(id) {
            if (!id || isProcessing) return;
            isProcessing = true;

            const statusEl = document.getElementById('status');
            statusEl.innerText = `Authenticating: ${id}...`;
            statusEl.className = "h-14 rounded-2xl flex items-center justify-center font-bold text-base tracking-wide text-blue-600 neo-inset px-4 text-center";

            // Stop scanner temporarily while processing to prevent battery drain and double scans
            stopScanner();

            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ teacherId: id.toUpperCase().trim() })
                });

                const res = await response.json();

                const textClass = res.success ? 'text-green-600' : 'text-amber-600';
                statusEl.innerText = res.message;
                statusEl.className = `h-14 rounded-2xl flex items-center justify-center font-bold text-base tracking-wide neo-inset px-4 text-center ${textClass}`;

            } catch (err) {
                statusEl.innerText = "Connection failed. Please retry.";
                statusEl.className = "h-14 rounded-2xl flex items-center justify-center font-bold text-base tracking-wide text-red-600 neo-inset px-4 text-center";
            } finally {
                setTimeout(() => {
                    isProcessing = false;
                    statusEl.innerText = "Ready to Scan";
                    statusEl.className = "h-14 rounded-2xl flex items-center justify-center font-bold text-base tracking-wide text-gray-500 neo-inset px-4 text-center";
                }, 1500); // Leave result on screen slightly longer so older staff can read it
            }
        }

        function submitManual() {
            const id = document.getElementById('manualId').value;
            if (id) {
                handleResult(id);
                document.getElementById('manualId').value = '';
            }
        }
    </script>
</body>

</html>
