<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Staff Attendance Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: #0f172a;
            overscroll-behavior-y: none;
        }

        #reader-container {
            transition: all 0.15s ease-out;
        }

        .scan-highlight {
            border-color: #f59e0b !important;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.5);
            transform: scale(1.02);
        }

        #reader {
            width: 100%;
            height: 100%;
            border-radius: 0.75rem;
            overflow: hidden;
        }

        #reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        #reader__dashboard_section_csr span {
            display: none !important;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">

    <!-- ================= AUTHENTICATION SCREEN ================= -->
    <div id="auth-screen"
        class="bg-white/80 backdrop-blur-2xl border border-slate-200/60 shadow-[0_8px_30px_rgb(0,0,0,0.08)] rounded-3xl p-8 w-full max-w-sm flex flex-col gap-6">
        <div class="text-center">
            <h1 class="text-2xl font-extrabold text-blue-800 tracking-tight">Admin Portal</h1>
            <p class="text-sm font-semibold text-slate-500 mt-1 uppercase tracking-widest">Star Kids Grammar</p>
        </div>

        <div class="flex flex-col gap-3">
            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Access PIN</label>
            <input type="password" id="pinInput"
                class="w-full bg-slate-50 border-2 border-slate-300 rounded-xl px-4 py-4 text-center text-2xl focus:outline-none focus:border-blue-500 font-bold text-slate-800 shadow-inner tracking-widest"
                placeholder="••••">
            <p id="auth-error" class="hidden text-red-600 text-xs font-bold text-center uppercase tracking-wide mt-1">
                Invalid PIN. Access Denied.</p>
        </div>

        <button onclick="verifyLogin()"
            class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white py-4 rounded-xl font-extrabold text-base shadow-lg transition-all">
            AUTHENTICATE
        </button>
    </div>

    <!-- ================= SCANNER SCREEN ================= -->
    <div id="scanner-screen"
        class="hidden bg-white/80 backdrop-blur-2xl border border-slate-200/60 shadow-[0_8px_30px_rgb(0,0,0,0.08)] rounded-3xl p-6 sm:p-8 w-full max-w-lg flex flex-col gap-6">

        <div class="text-center">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-blue-800 tracking-tight">Attendance System</h1>
            <p class="text-sm font-semibold text-slate-500 mt-1 uppercase tracking-widest">Star Kids Grammar</p>
        </div>

        <div id="status"
            class="h-16 rounded-xl flex items-center justify-center font-bold text-base sm:text-lg tracking-wide text-slate-600 bg-slate-100 border border-slate-300 shadow-inner px-4 text-center transition-colors duration-200">
            SYSTEM STANDBY
        </div>

        <div class="flex flex-col gap-4">
            <div id="reader-container"
                class="hidden bg-slate-50 p-2 rounded-2xl shadow-sm border-4 border-slate-200 aspect-square">
                <div id="reader" class="bg-slate-200 flex items-center justify-center"></div>
            </div>

            <button id="start-btn" onclick="startScanner()"
                class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white py-5 rounded-xl font-extrabold text-lg shadow-lg hover:shadow-blue-600/30 transition-all flex flex-col items-center gap-2">
                <svg class="w-8 h-8 opacity-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z">
                    </path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                ACTIVATE SCANNER
            </button>

            <div id="camera-controls" class="hidden flex flex-row gap-3">
                <button onclick="switchCamera()"
                    class="flex-1 bg-white border-2 border-slate-200 hover:bg-slate-50 active:bg-slate-100 text-slate-700 py-4 rounded-xl font-bold text-sm shadow-sm transition-all flex justify-center items-center">
                    🔄 FLIP CAMERA
                </button>
                <button onclick="stopScanner()"
                    class="flex-1 bg-red-50 border-2 border-red-200 hover:bg-red-100 active:bg-red-200 text-red-700 py-4 rounded-xl font-bold text-sm shadow-sm transition-all flex justify-center items-center">
                    ⏹️ STOP
                </button>
            </div>
        </div>

        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 flex flex-col gap-3">
            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Manual ID Entry</label>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="manualId" autocomplete="off"
                    class="w-full bg-white border-2 border-slate-300 rounded-xl px-4 py-4 text-base sm:text-lg focus:outline-none focus:border-blue-500 placeholder-slate-400 font-bold text-slate-800 transition-all uppercase shadow-sm"
                    placeholder="E.G. TCH-01">
                <button onclick="submitManual()"
                    class="w-full sm:w-auto bg-slate-800 hover:bg-slate-900 active:bg-black text-white px-8 py-4 rounded-xl font-bold text-base shadow-md transition-all whitespace-nowrap">
                    SUBMIT
                </button>
            </div>
        </div>

        <button onclick="logout()"
            class="text-xs text-slate-400 hover:text-red-600 font-bold tracking-widest uppercase mt-2 transition-colors">
            🔒 Lock Terminal
        </button>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxdzOJceHv9DGzxYhfpmjU9jWN-b5H2aQ-7GoHtWrGmpkOcNHkNuma1rCHftwqDvDME/exec';
        const ADMIN_PIN = "7860"; // <-- Change your password here

        let html5QrCode;
        let currentFacingMode = "environment";
        const scanCooldowns = new Map();
        const COOLDOWN_MS = 4000;
        let statusResetTimer = null;

        // Session Verification on Load
        document.addEventListener("DOMContentLoaded", () => {
            html5QrCode = new Html5Qrcode("reader");
            if (sessionStorage.getItem("adminAuth") === "true") {
                unlockTerminal();
            }
        });

        // Login Logic
        function verifyLogin() {
            const input = document.getElementById("pinInput").value;
            if (input === ADMIN_PIN) {
                sessionStorage.setItem("adminAuth", "true");
                unlockTerminal();
            } else {
                document.getElementById("auth-error").classList.remove("hidden");
                document.getElementById("pinInput").value = "";
            }
        }

        function unlockTerminal() {
            document.getElementById("auth-screen").classList.add("hidden");
            document.getElementById("scanner-screen").classList.remove("hidden");
        }

        function logout() {
            sessionStorage.removeItem("adminAuth");
            stopScanner();
            document.getElementById("pinInput").value = "";
            document.getElementById("auth-error").classList.add("hidden");
            document.getElementById("scanner-screen").classList.add("hidden");
            document.getElementById("auth-screen").classList.remove("hidden");
        }

        // Allow Enter key to trigger login
        document.getElementById("pinInput").addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
                e.preventDefault();
                verifyLogin();
            }
        });

        function setStatus(text, type) {
            const statusEl = document.getElementById('status');
            statusEl.innerText = text;
            if (statusResetTimer) clearTimeout(statusResetTimer);

            const baseClasses = "h-16 rounded-xl flex items-center justify-center font-bold text-base sm:text-lg tracking-wide shadow-inner px-4 text-center transition-colors duration-200 border ";
            if (type === 'ready') statusEl.className = baseClasses + "text-slate-600 bg-slate-100 border-slate-300";
            else if (type === 'scan') statusEl.className = baseClasses + "text-blue-800 bg-blue-100 border-blue-300";
            else if (type === 'success') statusEl.className = baseClasses + "text-emerald-800 bg-emerald-100 border-emerald-300";
            else if (type === 'warning') statusEl.className = baseClasses + "text-amber-800 bg-amber-100 border-amber-300";
            else if (type === 'error') statusEl.className = baseClasses + "text-red-800 bg-red-100 border-red-300";
        }

        function startScanner() {
            document.getElementById('start-btn').classList.add('hidden');
            document.getElementById('reader-container').classList.remove('hidden');
            document.getElementById('camera-controls').classList.remove('hidden');
            setStatus("POINT CAMERA AT QR CODE", 'ready');

            html5QrCode.start(
                { facingMode: currentFacingMode },
                { fps: 60, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 },
                (decodedText) => { handleResult(decodedText); },
                (errorMessage) => { }
            ).catch((err) => {
                alert("Camera access denied. Please grant browser permissions.");
                stopScanner();
            });
        }

        function stopScanner() {
            document.getElementById('start-btn').classList.remove('hidden');
            document.getElementById('reader-container').classList.add('hidden');
            document.getElementById('camera-controls').classList.add('hidden');
            setStatus("SYSTEM STANDBY", 'ready');

            try {
                if (html5QrCode && html5QrCode.isScanning) {
                    html5QrCode.stop().catch(e => console.log(e));
                }
            } catch (e) { }
        }

        function switchCamera() {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    setTimeout(() => startScanner(), 150);
                });
            }
        }

        async function handleResult(id) {
            const cleanId = id.toUpperCase().trim();
            const now = Date.now();
            const lastScan = scanCooldowns.get(cleanId);

            if (lastScan && (now - lastScan) < COOLDOWN_MS) return;
            scanCooldowns.set(cleanId, now);

            const container = document.getElementById('reader-container');
            container.classList.add('scan-highlight');
            if (navigator.vibrate) navigator.vibrate(40);
            setTimeout(() => container.classList.remove('scan-highlight'), 300);

            setStatus(`VERIFYING: ${cleanId}...`, 'scan');

            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ teacherId: cleanId })
                });

                const res = await response.json();

                if (res.success) {
                    setStatus(`✔ ${res.message.toUpperCase()}`, 'success');
                    if (navigator.vibrate) navigator.vibrate([80, 40, 80]);
                } else {
                    const isWarning = res.message.toLowerCase().includes("already");
                    setStatus(`⚠ ${res.message.toUpperCase()}`, isWarning ? 'warning' : 'error');
                    if (navigator.vibrate && !isWarning) navigator.vibrate([200]);
                }

            } catch (err) {
                setStatus("✖ NETWORK ERROR - RETRY", 'error');
                scanCooldowns.delete(cleanId);
            } finally {
                statusResetTimer = setTimeout(() => {
                    setStatus("READY FOR NEXT SCAN", 'ready');
                }, 3500);
            }
        }

        function submitManual() {
            const inputEl = document.getElementById('manualId');
            const id = inputEl.value;
            if (id) {
                handleResult(id);
                inputEl.value = '';
                inputEl.blur();
            }
        }

        document.getElementById("manualId").addEventListener("keypress", function (event) {
            if (event.key === "Enter") {
                event.preventDefault();
                submitManual();
            }
        });
    </script>
</body>

</html>
